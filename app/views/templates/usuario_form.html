{% extends "base.html" %}
{% block titulo %}Novo usuário{% endblock %}
{% block conteudo %}
{% set d = dados or {} %}
<h1>Novo usuário</h1>

<form method="post" action="{{ url_for('usuarios.novo') }}" class="formulario" autocomplete="off">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

  <label>Login (letras e números)
    <input type="text" name="login" value="{{ d['login']|default('') }}" required minlength="3" maxlength="30">
  </label>
  <label>Nome completo
    <input type="text" name="nome" value="{{ d['nome']|default('') }}" required minlength="3" maxlength="80">
  </label>
  <label>Perfil
    <select name="perfil" required>
      <option value="operador" {% if d['perfil']|default('') == 'operador' %}selected{% endif %}>Operador (lança a folha e cadastra)</option>
      <option value="admin" {% if d['perfil']|default('') == 'admin' %}selected{% endif %}>Administrador (acesso total)</option>
    </select>
  </label>
  <label>Senha inicial
    <input type="password" name="senha" required minlength="12" maxlength="128" autocomplete="new-password">
    <span class="ajuda">Mín. 12 caracteres, com letras e números, sem o login.</span>
  </label>

  <div class="acoes">
    <a href="{{ url_for('usuarios.listar') }}" class="botao secundario">Cancelar</a>
    <button type="submit" class="primario">Criar usuário</button>
  </div>
</form>
{% endblock %}
